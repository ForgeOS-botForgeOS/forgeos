name: Supabase keep-alive

# Free-tier Supabase projects pause after ~7 idle days (FIX-PLAYBOOK §5).
# One tiny REST query per day counts as activity and keeps the project awake.
# Reuses the same repo Actions variables as deploy.yml — nothing hardcoded.
# Heads-up: GitHub disables scheduled workflows after ~60 days without repo
# activity and emails a "re-enable" link — press it if that ever happens.
on:
  schedule:
    - cron: '23 6 * * *' # daily, 06:23 UTC (odd minute dodges the top-of-hour queue)
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query one row so the database registers activity
        env:
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          # The anon key is publishable by design — it already ships inside the site's JS bundle.
          SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Repo variables VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY are missing."
            exit 1
          fi
          # RLS may hide all rows from anonymous callers — an empty [] reply is still DB activity.
          curl --fail-with-body -sS \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/profiles?select=id&limit=1"
          echo
          echo "Supabase answered — project stays awake."
