name: Build Android APK

# Builds the installable Android app from the web build (Capacitor) and publishes
# it as a rolling GitHub release so the website can offer it for direct download.
on:
  push:
    branches: [main]
    paths:
      - 'forgeos/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: forgeos
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: forgeos/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - run: npm ci

      - name: Build web bundle
        # Same live-service keys as the website build (deploy.yml) — without
        # them the APK falls back to offline/mock mode and hides login & cloud.
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
          VITE_VISION_API_URL: ${{ vars.VITE_VISION_API_URL }}
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Prepare permanent signing key
        # Without a permanent key every CI build gets a random debug signature,
        # and Android refuses to install the "update" over the existing app.
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "::error::Missing ANDROID_KEYSTORE_B64 secret. Add it (and ANDROID_KEYSTORE_PASSWORD) under Settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/forgeos.jks"

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/forgeos.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -PappVersionCode=$GITHUB_RUN_NUMBER

      - name: Stage APK
        run: cp android/app/build/outputs/apk/release/app-release.apk forgeos.apk

      - name: Stage web bundle for in-app OTA updates
        # The installed app checks version.json on launch and swaps in web.zip
        # by itself (WebUpdatePlugin) — no APK re-download for web-only changes.
        run: |
          (cd dist && zip -qr ../web.zip .)
          NATIVE_VERSION=$(grep -oP 'NATIVE_VERSION = \K\d+' android/app/src/main/java/com/forgeos/app/WebUpdatePlugin.kt)
          ZIP_SHA256=$(sha256sum web.zip | cut -d' ' -f1)
          printf '{"sha":"%s","zipSha256":"%s","nativeVersion":%s,"builtAt":"%s"}\n' \
            "$GITHUB_SHA" "$ZIP_SHA256" "$NATIVE_VERSION" "$(date -u +%FT%TZ)" > version.json
          cat version.json

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: forgeos-apk
          path: forgeos/forgeos.apk

      - name: Publish rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-latest
          name: ForgeOS Android (latest)
          files: |
            forgeos/forgeos.apk
            forgeos/web.zip
            forgeos/version.json
          make_latest: 'true'
          body: |
            Latest ForgeOS Android build (signed with the permanent ForgeOS key —
            new APKs install straight over the old version, no uninstall needed).
            Download `forgeos.apk`, then on your phone allow “Install unknown apps”
            for your browser when prompted. Distributed from the website only.
