name: Build Android APK

# Builds the installable Android app from the web build (Capacitor) and publishes
# it as a rolling GitHub release so the website can offer it for direct download.
on:
  push:
    branches: [main]
    paths:
      - 'forgeos/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: forgeos
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: forgeos/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - run: npm ci

      - name: Build web bundle
        # Same live-service keys as the website build (deploy.yml) — without
        # them the APK falls back to offline/mock mode and hides login & cloud.
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
          VITE_VISION_API_URL: ${{ vars.VITE_VISION_API_URL }}
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Stage APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk forgeos.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: forgeos-apk
          path: forgeos/forgeos.apk

      - name: Publish rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-latest
          name: ForgeOS Android (latest)
          files: forgeos/forgeos.apk
          make_latest: 'true'
          body: |
            Latest ForgeOS Android build (debug-signed for direct install).
            Download `forgeos.apk`, then on your phone allow “Install unknown apps”
            for your browser when prompted. Distributed from the website only.
